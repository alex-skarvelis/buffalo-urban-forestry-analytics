name: Full-Stack Data Pipeline Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tree_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clone Repository Code
      uses: actions/checkout@v3

    - name: Install PostgreSQL Command Line Client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Set Up Python Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Data Science Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas seaborn matplotlib

    - name: Provision Mock Structural Schema
      env:
        PGPASSWORD: test_password
      run: |
        psql -h localhost -U test_user -d tree_db -c "
          CREATE TABLE tree_inventory (
            editing TEXT, botanical_name TEXT, common_name TEXT, dbh TEXT,
            total_yearly_eco_benefits TEXT, stormwater_benefits TEXT, stormwater_gallons_saved TEXT,
            greenhouse_co2_benefits TEXT, co2_avoided TEXT, co2_sequestered TEXT,
            energy_benefits TEXT, kwh_saved TEXT, therms_saved TEXT,
            air_quality_benefits TEXT, pollutants_saved TEXT, property_benefits TEXT,
            leaf_surface_area TEXT, address TEXT, street TEXT, side TEXT,
            site TEXT, council_district TEXT, park_name TEXT, latitude TEXT,
            longitude TEXT, site_ID TEXT, location_degrees TEXT, location_point TEXT
          );
        "

    - name: Clone Repository Code
      uses: actions/checkout@v3

    - name: Verify Staged Civic Dataset
      run: |
          echo "Verifying local data repository presence..."
          wc -l tree_inventory_full.csv

    - name: Bulk Import Live Data into PostgreSQL
      run: |
          echo "Importing thousands of live tree records into tree_db..."
          export PGPASSWORD='test_password'
          psql -h localhost -U test_user -d tree_db -c "\copy tree_inventory FROM 'tree_inventory_full.csv' WITH CSV HEADER;"
          echo "Data ingestion complete."

    - name: Execute SQL Analysis Script & Export Plot Assets
      run: |
          echo "Executing primary analytical calculations..."
          export PGPASSWORD='test_password'
          
          # 1. Run your main file completely to output all 4 questions into the runner logs
          psql -h localhost -U test_user -d tree_db -f scripts/urban_forestry_analysis.sql
          
          # 2. Extract Question 3 metrics into an unfragmented CSV file for Python
          echo "Extracting Question 3 R-Squared variance calculations..."
          psql -h localhost -U test_user -d tree_db -A -F "," -t -c "
            WITH base_filtered AS (
                SELECT REGEXP_REPLACE(TRIM(botanical_name), '\s+', ' ', 'g') AS raw_name, dbh, total_yearly_eco_benefits
                FROM tree_inventory
                WHERE botanical_name IS NOT NULL 
                  AND TRIM(botanical_name) != ''
                  AND total_yearly_eco_benefits > 0
                  AND UPPER(TRIM(botanical_name)) NOT IN ('VACANT', 'UNSUITABLE VACANT', 'UNKNOWN TREE', 'UNKNOWN SHRUB', 'STUMP OBSTRUCTED', 'STUMP', 'STANDING BUTT', '*CALLS', '448', '445', '444', '443', '0')
                  AND dbh > 2 
                  AND dbh <= 75
            ),
            strip_cultivars AS (
                SELECT CASE WHEN raw_name LIKE '%''%' THEN TRIM(SPLIT_PART(raw_name, '''', 1)) ELSE raw_name END AS cleaned_name, dbh, total_yearly_eco_benefits
                FROM base_filtered
            ),
            strict_species_only AS (
                SELECT INITCAP(TRIM(cleaned_name)) AS tree_species, dbh, total_yearly_eco_benefits
                FROM strip_cultivars
                WHERE cleaned_name LIKE '% %' AND cleaned_name !~* ' (spp|species|sp)\.?$' AND cleaned_name !~* ' x\.?$'
            )
            SELECT 'tree_species,sample_size,avg_benefits_usd,species_size_explanation_percentage'
            UNION ALL
            SELECT tree_species || ',' || COUNT(*) || ',' || ROUND(AVG(total_yearly_eco_benefits)::NUMERIC, 2) || ',' || ROUND(COALESCE(REGR_R2(total_yearly_eco_benefits, dbh)::NUMERIC, 0) * 100.0, 2)
            FROM strict_species_only
            GROUP BY tree_species
            HAVING COUNT(*) >= 5;
          " -o database_output.csv

    - name: Execute Python Seaborn Visualization Test
      run: |
          python visualizations/plot_trend.py

    - name: Upload Generated Regression Chart
      uses: actions/upload-artifact@v4
      with:
        name: regression-analysis-chart
        path: species_size_vs_benefits_regression.png

